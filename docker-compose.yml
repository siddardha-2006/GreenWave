version: '3.8'

services:
  green-wave:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: green-wave-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=green_wave
      - FRONTEND_ORIGIN=*
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: green-wave-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
